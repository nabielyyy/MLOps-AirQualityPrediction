services:
  # MLflow server untuk menyimpan metadata eksperimen, registri model, dan artifact.
  mlflow-server:
    # Build the image using the Dockerfile instead of using a raw python image
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile # Change to Dockerfile.mlflow if you named it differently
    container_name: mlflow-server
    
    # Ports and networks remain the same
    expose:
      - "5000"
    ports:
      - "5000:5000"
      
    # Volume mapping remains the same
    volumes:
      - .:/workspaces/MLOps-AirQualityPrediction
      
    networks:
      - mlops-network

  # FastAPI inference service yang direplikasi 3 kali.
  api-service:
    build:
      context: .
      dockerfile: docker/inference/Dockerfile
    depends_on:
      mlflow-server:
        condition: service_healthy
    expose:
      - "8000" # Hanya expose internal, tidak lagi mapping ke host port
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MLFLOW_MODEL_ALIAS: Production
      MLFLOW_ALLOW_FILE_STORE: "true"
      MODEL_NAME: AirQualityRandomForestModel
      MODEL_VERSION: "${MODEL_VERSION:-1}"
      # Penyesuaian environment: MODEL_SERVER_URL dihapus dan USE_MLFLOW_MODEL_SERVER 
      # diubah menjadi false karena service mlflow-model-serving sudah dihapus.
      USE_MLFLOW_MODEL_SERVER: "false"
      PYTHONPATH: /app
    volumes:
      - ./mlruns:/app/mlruns
      - ./model_registry.yaml:/app/model_registry.yaml
    networks:
      - mlops-network
    deploy:
      replicas: 3 # Menjalankan 3 instance dari api-service

  # Nginx Load Balancer untuk mendistribusikan traffic ke 3 replica api-service.
  nginx-lb:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "80:80" # Akses API melalui port 80 di host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # Mount konfigurasi nginx
    depends_on:
      - api-service
    networks:
      - mlops-network

networks:
  # Custom bridge network agar API dan MLflow bisa saling terhubung.
  mlops-network:
    driver: bridge