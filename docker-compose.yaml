services:
  # MLflow server untuk menyimpan metadata eksperimen, registri model, dan artifact.
  mlflow-server:
    image: python:3.11-slim
    container_name: mlflow-server
    working_dir: /app
    command: >
      sh -c "mkdir -p /workspaces/MLOps-AirQualityPrediction/mlruns &&
      pip install --no-cache-dir mlflow==2.16.2 &&
      mlflow server --backend-store-uri sqlite:////workspaces/MLOps-AirQualityPrediction/mlruns/mlflow.db --default-artifact-root /workspaces/MLOps-AirQualityPrediction/mlruns --host 0.0.0.0 --port 5000 --gunicorn-opts \"--forwarded-allow-ips='*'\""
    expose:
      - "5000"
    ports:
      - "5000:5000"
    volumes:
      - .:/workspaces/MLOps-AirQualityPrediction
    networks:
      - mlops-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # MLflow model serving yang mengekpos model registry ke endpoint REST untuk inference.
  mlflow-model-serving:
    image: python:3.11-slim
    container_name: mlflow-model-serving
    working_dir: /app
    command:
      - sh
      - -c
      - |
        pip install --no-cache-dir mlflow==2.16.2 scikit-learn pandas
        mlflow models serve -m models:/AirQualityRandomForestModel/${MODEL_VERSION:-1} --host 0.0.0.0 --port 5001 --no-conda --env-manager local
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MLFLOW_ALLOW_FILE_STORE: "true"
      MODEL_NAME: AirQualityRandomForestModel
      MLFLOW_MODEL_ALIAS: Production
      MODEL_VERSION: "${MODEL_VERSION:-1}"
    expose:
      - "5001"
    ports:
      - "5001:5001"
    volumes:
      - .:/workspaces/MLOps-AirQualityPrediction
    depends_on:
      mlflow-server:
        condition: service_healthy
    networks:
      - mlops-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # FastAPI inference service yang dapat diskalakan dengan Compose.
  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mlflow-server:
        condition: service_healthy
      mlflow-model-serving:
        condition: service_healthy
    ports:
      - "8000-8002:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MLFLOW_MODEL_ALIAS: Production
      MLFLOW_ALLOW_FILE_STORE: "true"
      MODEL_NAME: AirQualityRandomForestModel
      MODEL_VERSION: "${MODEL_VERSION:-1}"
      MODEL_SERVER_URL: http://mlflow-model-serving:5001
      USE_MLFLOW_MODEL_SERVER: "true"
      PYTHONPATH: /app
    volumes:
      - ./mlruns:/app/mlruns
      - ./model_registry.yaml:/app/model_registry.yaml
    networks:
      - mlops-network

networks:
  # Custom bridge network agar API dan MLflow bisa saling terhubung.
  mlops-network:
    driver: bridge
